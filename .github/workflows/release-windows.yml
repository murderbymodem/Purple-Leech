name: Windows release

# Push a tag like v4.0.0 to build PurplePlunder.exe and attach it to a GitHub release.
# Run manually from the Actions tab to just build the zip as a workflow artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $file = "PurplePlunder/GlobalAssemblyInfo.cs"
          (Get-Content $file) -replace 'AssemblyFileVersion\(".*?"\)', "AssemblyFileVersion(""$version"")" | Set-Content $file
          Get-Content $file

      - name: Get FFmpeg
        shell: pwsh
        run: ./scripts/get-ffmpeg.ps1

      - name: Publish
        run: >
          dotnet publish PurplePlunder/PurplePlunder/PurplePlunder.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Package
        shell: pwsh
        run: |
          $name = if ("${{ github.ref_type }}" -eq "tag") { "PurplePlunder-${{ github.ref_name }}-win-x64.zip" } else { "PurplePlunder-win-x64.zip" }

          # License texts for Purple Plunder, the bundled libraries and FFmpeg
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path publish/licenses | Out-Null
          Copy-Item LICENSE publish/LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.md publish/THIRD-PARTY-NOTICES.md
          Copy-Item licenses/* publish/licenses/
          Copy-Item PurplePlunder/Libraries/ffmpeg-LICENSE.txt, PurplePlunder/Libraries/ffmpeg-README.txt publish/licenses/
          if (-not (Test-Path publish/ffmpeg.exe)) { throw "ffmpeg.exe is missing from the build output" }

          Compress-Archive -Path publish/* -DestinationPath $name
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: PurplePlunder-win-x64
          path: ${{ env.ZIP_NAME }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
